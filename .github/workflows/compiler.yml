name: Crust compiler
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust targets
        run: rustup target add x86_64-unknown-none aarch64-unknown-none
      - run: npm install
      - run: npm run check && npm test
      - name: Check freestanding targets
        run: |
          cargo check --manifest-path build/fixture/Cargo.toml --target x86_64-unknown-none --lib
          cargo check --manifest-path build/fixture/Cargo.toml --target aarch64-unknown-none --lib
  thistle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: crust
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: kittycrow-kittyx/thistle
          ref: 19b8c6c0d7b81e1526119f52fff8b5bc6f16bf6a
          path: thistle
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm install --prefix crust && npm install --prefix crust/vendor/bake
      - run: npm run build --prefix crust
      - run: node crust/dist/src/thistle-project.js thistle
      - run: cd crust/vendor/bake && bun src/cli.ts --project ../../../thistle/tsconfig.crust.json --out-dir build/bake-rust --target=rust --engine=host
      - run: node crust/dist/src/cli.js --manifest thistle/build/bake-rust/bake-manifest.json --out-dir crust/build/rei
      - name: Build Thistle's generated Rust without warnings
        env:
          RUSTFLAGS: -D warnings
        run: |
          rustup target add x86_64-unknown-none aarch64-unknown-none
          cargo build --release -j 2 --manifest-path crust/build/rei/Cargo.toml --target x86_64-unknown-none --lib
          cargo build --release -j 2 --manifest-path crust/build/rei/Cargo.toml --target aarch64-unknown-none --lib
