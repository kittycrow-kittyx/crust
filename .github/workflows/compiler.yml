name: Crust compiler
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust targets
        run: rustup target add x86_64-unknown-none aarch64-unknown-none
      - run: npm install
      - run: npm run check && npm test
      - name: Check freestanding targets
        run: |
          cargo check --manifest-path build/fixture/Cargo.toml --target x86_64-unknown-none --lib
          cargo check --manifest-path build/fixture/Cargo.toml --target aarch64-unknown-none --lib
  thistle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: crust
      - uses: actions/checkout@v4
        with:
          repository: kitty-crow/bake
          ref: 3d3d1893c6baf64f1fd771371a1e8b250ece8056
          path: bake
      - uses: actions/checkout@v4
        with:
          repository: kitty-crow/thistle
          path: thistle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm install --prefix crust && npm install --prefix bake
      - run: npm run build --prefix crust
      - run: node crust/dist/src/thistle-project.js thistle
      - run: cd bake && bun src/cli.ts --project ../thistle/tsconfig.crust.json --out-dir build/bake-rust --target=rust
      - run: node crust/dist/src/cli.js --manifest thistle/build/bake-rust/bake-manifest.json --out-dir crust/build/rei
      - name: Check Thistle's generated Rust
        run: |
          rustup target add x86_64-unknown-none aarch64-unknown-none
          cargo check --manifest-path crust/build/rei/Cargo.toml --target x86_64-unknown-none --lib
          cargo check --manifest-path crust/build/rei/Cargo.toml --target aarch64-unknown-none --lib
